
[package]
name = "linux-everything"
version = "0.1.0"
description = "A Linux system education and search tool"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open", "devtools", "custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"  # For file walking
ignore = "0.4" # For respecting .gitignore equivalents if needed, or just fast walking
glob = "0.3"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
